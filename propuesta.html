<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propuesta Comercial | Comte Chile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='5' y='55' width='22' height='40' rx='4' fill='%23ffe92e' stroke='%23000' stroke-width='4'/><rect x='39' y='32' width='22' height='63' rx='4' fill='%23ff5964' stroke='%23000' stroke-width='4'/><rect x='73' y='10' width='22' height='85' rx='4' fill='%2363c5ee' stroke='%23000' stroke-width='4'/></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, Arial, Helvetica, sans-serif; background: #f6f7fb; color: #0f1117; }

    a { color: inherit; text-decoration: none; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(246,247,251,.86);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid #e2e6ee;
    }

    .nav {
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: min(1440px, calc(100% - 80px));
      margin: 0 auto;
    }

    .brand { display: flex; align-items: center; flex-shrink: 0; }
    .logo { display: flex; align-items: flex-end; gap: 18px; }
    .bars { display: flex; align-items: flex-end; gap: 7px; }
    .bar { width: 22px; border: 3px solid black; border-radius: 4px; box-sizing: border-box; box-shadow: 2px 2px 0px black; }
    .yellow { height: 30px; background: #fff52e; }
    .red    { height: 41px; background: #ff5b66; }
    .blue   { height: 52px; background: #6ecbf2; }
    .text { font-size: 38px; font-weight: 900; line-height: 0.9; letter-spacing: -2px; color: black; }

    .nav-links {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #262b36;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
      margin-top: 18px;
    }
    .nav-links a {
      padding: 6px 10px;
      border-radius: 8px;
      transition: background .15s;
    }
    .nav-links a:hover { background: rgba(15,17,23,.07); }
    .nav-links a.active { color: #0f1117; border-bottom: 2px solid #0f1117; border-radius: 0; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 22px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      background: linear-gradient(135deg,#1a1d27,#0f1117);
      color: #fff;
      box-shadow: 0 8px 28px rgba(15,17,23,.22);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(15,17,23,.28); }

    .pdf-wrapper {
      width: 100%;
      height: calc(100vh - 92px);
    }
    .pdf-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav">
      <a href="/" class="brand" aria-label="Comte Chile">
        <div class="logo">
          <div class="bars">
            <div class="bar yellow"></div>
            <div class="bar red"></div>
            <div class="bar blue"></div>
          </div>
          <div class="text">comte</div>
        </div>
      </a>

      <nav class="nav-links">
        <a href="/quienes-somos">Quiénes somos</a>
        <a href="/servicios">Servicios</a>
        <a href="/metodologia">Metodología</a>
        <a href="/proyectos">Proyectos</a>
        <a href="/clientes">Clientes</a>
        <a href="/ecosistema">COMTE en el ecosistema</a>
        <a href="/elearning">eLearning</a>
        <a href="/propuesta" class="active">Propuesta</a>
      </nav>
      <a href="/#contacto" class="btn">Agendar reunión</a>
    </div>
  </header>

  <div class="pdf-wrapper">
    <iframe src="/COMTE_Brochure.pdf" title="Propuesta Comercial Comte Chile"></iframe>
  </div>

</body>
</html>
